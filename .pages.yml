# Pages CMS — singura sursă de configurare. Se pune la rădăcina repo-ului.
# Documentație: https://pagescms.org/docs/configuration
media:
  input: public/images
  output: /images

content:
  - name: obiecte
    label: Obiecte muzeu
    type: collection
    path: content/obiecte
    exclude: [index.json]
    filename: "{primary}.json"
    view:
      primary: titlu
      sort: titlu
      fields: [titlu, sala, perioada, raion]
    fields:
      - name: id
        label: ID (slug, ex: clopotel-arama)
        type: string
        required: true
      - name: titlu
        label: Titlu
        type: string
        required: true
      - name: sala
        label: Sala
        type: select
        required: true
        options:
          - sala-documentelor
          - sala-scolii
          - sala-naturii
          - sala-mestesugurilor
          - sala-gospodariei
          - sala-marturiilor
      - name: perioada
        label: Perioada
        type: string
        required: true
      - name: an
        label: An
        type: string
        required: true
      - name: material
        label: Material
        type: string
        required: true
      - name: dimensiuni
        label: Dimensiuni
        type: string
      - name: autor
        label: Autor
        type: string
      - name: locatie_fizica
        label: Locația fizică
        type: string
      - name: descriere_scurta
        label: Descriere scurtă
        type: text
      - name: poveste
        label: Poveste
        type: text
        required: true
      - name: imagine_principala
        label: Imagine principală (fișier din /images sau URL extern)
        type: image
      - name: img_1
        label: Imagine 2 (URL sau cale)
        type: string
      - name: img_2
        label: Imagine 3 (URL sau cale)
        type: string
      - name: img_3
        label: Imagine 4 (URL sau cale)
        type: string
      - name: img_4
        label: Imagine 5 (URL sau cale)
        type: string
      - name: vedeta
        label: Obiect vedetă
        type: boolean
      - name: raion
        label: Raion (id, ex: chisinau)
        type: string
      - name: sat
        label: Sat (id sau gol)
        type: string

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content(create): {path} via Pages CMS"
      update: "content(update): {path} via Pages CMS"
      delete: "content(delete): {path} via Pages CMS"
