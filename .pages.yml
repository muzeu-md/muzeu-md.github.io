media:
  input: muzeu-virtual/images
  output: /muzeu-virtual/images
  extensions: [jpg, jpeg, png, webp, gif]
  categories: [image]
  rename: safe

content:
  - name: obiecte
    label: Obiecte muzeu
    type: collection
    path: muzeu-virtual/content/obiecte
    format: json
    filename: "{primary}.json"
    view:
      primary: titlu
      sort: titlu
      order: asc
      search: [titlu, id, sat, poveste]
    fields:
      - name: id
        label: ID (slug unic)
        type: string
        required: true
        description: "Ex: clopotel-arama"
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "doar litere mici, cifre si -"
        options:
          maxlength: 80
      - name: titlu
        label: Titlu obiect
        type: string
        required: true
        options:
          maxlength: 120
      - name: sala
        label: Sala
        type: select
        required: true
        options:
          values:
            - sala-documentelor
            - sala-scolii
            - sala-naturii
            - sala-mestesugurilor
            - sala-gospodariei
            - sala-marturiilor
      - name: perioada
        label: Perioada
        type: string
        required: true
        options:
          maxlength: 60
      - name: an
        label: An
        type: string
        required: true
        description: "Ex: 1932 / cca 1900 / sec. XIX"
        options:
          maxlength: 20
      - name: material
        label: Material
        type: string
        required: true
        options:
          maxlength: 120
      - name: dimensiuni
        label: Dimensiuni
        type: string
        required: true
        options:
          maxlength: 60
      - name: autor
        label: Autor fisa
        type: string
        options:
          maxlength: 120
      - name: locatie_fizica
        label: Locatia obiectului
        type: string
        options:
          maxlength: 120
      - name: descriere_scurta
        label: Descriere scurta
        type: text
        required: true
        options:
          maxlength: 500
      - name: poveste
        label: Poveste (pers. I)
        type: text
        required: true
        options:
          maxlength: 2000
      - name: imagine_principala
        label: Imagine principala (URL)
        type: string
        required: true
        description: "Lipește URL-ul. Ex: https://i.ibb.co/xxx/poza.jpg"
        pattern:
          regex: "^https?://.+"
          message: "Trebuie sa inceapa cu http:// sau https://"
      - name: img_1
        label: Imagine 1 (URL)
        type: string
        required: false
        description: "Lipește URL-ul sau lasa gol"
      - name: img_2
        label: Imagine 2 (URL)
        type: string
        required: false
        description: "Lipește URL-ul sau lasa gol"
      - name: img_3
        label: Imagine 3 (URL)
        type: string
        required: false
        description: "Lipește URL-ul sau lasa gol"
      - name: img_4
        label: Imagine 4 (URL)
        type: string
        required: false
        description: "Lipește URL-ul sau lasa gol"
      - name: vedeta
        label: Obiect-vedeta?
        type: boolean
      - name: raion
        label: Raion (id)
        type: string
        required: true
        description: "Ex: chisinau"
      - name: sat
        label: Sat (id sau gol)
        type: string
        required: false
        description: "Gol = tot raionul. Ex: truseni"

  - name: sali
    label: Sali muzeu
    type: file
    path: muzeu-virtual/data/sali.json
    format: json
    list: true
    fields:
      - name: id
        type: string
        required: true
      - name: nume
        type: string
        required: true
      - name: descriere
        type: text

  - name: raioane
    label: Raioane / Sate
    type: file
    path: muzeu-virtual/data/raioane.json
    format: json
    fields:
      - name: raioane
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nume} ({index})"
        fields:
          - name: id
            type: string
            required: true
          - name: nume
            type: string
            required: true
          - name: stare
            type: select
            required: true
            options:
              values: [pilot, curand]