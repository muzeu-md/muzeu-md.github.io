name: build-index

on:
  push:
    paths:
      - "muzeu-virtual/content/obiecte/**"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerează content/obiecte/index.json
        run: python3 muzeu-virtual/scripts/build-index.py
      - name: Commit dacă s-a schimbat ceva
        run: |
          if git diff --quiet -- muzeu-virtual/content/obiecte/index.json; then
            echo "index.json neschimbat"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add muzeu-virtual/content/obiecte/index.json
            git commit -m "content: regenerează obiecte/index.json"
            git push
          fi
